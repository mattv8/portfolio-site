services:
  nginx:
    image: nginx:latest
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${NGINX_PORT}:443"
    build:
      context: ./nginx
      dockerfile: ../dockerfile/nginx.Dockerfile
      args:
        HOSTNAME: ${HOSTNAME}
        LOG_ROTATE_INTERVAL: ${LOG_ROTATE_INTERVAL}
        LOG_ROTATE_COUNT: ${LOG_ROTATE_COUNT}
        LOG_ROTATE_COMPRESS: ${LOG_ROTATE_COMPRESS}
    volumes:
      - ./src:/var/www/html
      - ./nginx:/etc/nginx/conf.d/
      - ./logs:/var/www/log
    depends_on:
      - php-fpm
    networks:
      - app-network

  php-fpm:
    image: php:8.1-fpm
    restart: ${RESTART_POLICY:-unless-stopped}
    build:
      context: ./dockerfile
      dockerfile: php-fpm.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./src:/var/www/html
      - ./logs:/var/www/log
    depends_on:
      - mariadb
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${PHPMA_PORT}:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER} # Remove these to password protect PMA
      PMA_PASSWORD: ${MYSQL_PASSWORD} # Remove these to password protect PMA
    depends_on:
      - mariadb
    networks:
      - app-network

  mariadb:
    image: mariadb
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d  # SQL files to be processed on build
      - db_data:/var/lib/mysql
    configs:
      - source: docker-sql.cnf
        target: /etc/mysql/mariadb.conf.d/docker-sql.cnf
    networks:
      - app-network

configs:
  docker-sql.cnf:
    content: |
      [mysqld]
      sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION

volumes:
  db_data:

networks:
  app-network: