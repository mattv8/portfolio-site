name: Portfolio CI/CD Pipeline

on:
  push:
    branches:
      - '**' # Trigger on all branches
    paths:
      - 'src/**' # Trigger on changes to any file inside the /src directory
      - '.github/workflows/ci.yml' # Trigger on changes to the workflow file
  workflow_dispatch: # Manual trigger

jobs:
  deploy-to-development:
    name: Deploy to Development Server
    runs-on: self-hosted
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      WEBROOT: ${{ secrets.DEVELOPMENT_ROOT }}
      USER: ${{ secrets.WEBROOT_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Sync Site Directory
        run: |
          if [ -z "${{env.WEBROOT}}" ]; then echo "Need to set webroot as GitHub Actions secret" && exit 1; fi
          sudo rsync -avzr ./src/ ${{env.WEBROOT}} \
            --exclude 'robots.txt' \
            --exclude 'vault' \
            --exclude 'conf/config.local.php' \
            --exclude 'fitbit_cache' \
            --delete
          sudo chown $USER:$USER ${{env.WEBROOT}} -R

  deploy-to-production:
    name: Deploy to Production Server
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'
    env:
      WEBROOT: ${{ secrets.PRODUCTION_WEBROOT }}
      USER: ${{ secrets.WEBROOT_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install UglifyJS
        run: |
          sudo npm install uglifyjs-folder -g
          for file in ./src/js/*.js; do uglifyjs "$file" -o "${file%.*}.min.js" -c; done; #Uglify inidividual files
          find ./src/js -type f -name "*.js" -not -name "*.min.js" -delete #Remove the unminified JS

      - name: Sync Webroot to Production
        run: |
          if [ -z "${{env.WEBROOT}}" ]; then echo "Need to set webroot as GitHub Actions secret" && exit 1; fi
          sudo rsync -avzr ./src/ ${{env.WEBROOT}} \
            --exclude 'robots.txt' \
            --exclude 'vault' \
            --exclude 'conf/config.local.php' \
            --exclude 'fitbit_cache' \
            --delete-delay
          sudo chown $USER:$USER ${{env.WEBROOT}} -R
